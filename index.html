<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f6f8">
    <title>Ray的笔记</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="笔记列表">
        <header class="sidebar-header">
          <div class="brand">
            <p class="eyebrow">NOTES</p>
            <input
              id="appTitleInput"
              class="app-title-input"
              type="text"
              value="Ray的笔记"
              autocomplete="off"
              aria-label="笔记名称"
              data-testid="app-title-input"
            >
          </div>
          <div class="header-actions">
            <button
              id="themeToggle"
              class="icon-button"
              type="button"
              title="切换暗黑模式"
              aria-label="切换暗黑模式"
              data-testid="theme-toggle"
            >
              <svg class="icon" aria-hidden="true"><use id="themeIcon" href="#icon-moon"></use></svg>
            </button>
            <button
              id="newNoteButton"
              class="icon-button primary"
              type="button"
              title="新建笔记 (Ctrl+N)"
              aria-label="新建笔记"
              data-testid="new-note"
            >
              <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
            </button>
          </div>
        </header>

        <div class="search-row">
          <svg class="icon search-icon" aria-hidden="true"><use href="#icon-search"></use></svg>
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="搜索笔记"
            autocomplete="off"
            aria-label="搜索笔记"
            data-testid="search-input"
          >
        </div>

        <div class="list-toolbar">
          <span id="noteCount" class="note-count" data-testid="note-count">0 条笔记</span>
          <label class="sr-only" for="sortSelect">排序方式</label>
          <select id="sortSelect" class="sort-select" data-testid="sort-select">
            <option value="updated">最近编辑</option>
            <option value="created">创建时间</option>
            <option value="title">文字排序</option>
          </select>
        </div>

        <div id="noteList" class="note-list" data-testid="note-list"></div>
        <div id="listEmptyState" class="list-empty" data-testid="list-empty">
          <svg class="icon large" aria-hidden="true"><use href="#icon-note"></use></svg>
          <p>还没有笔记</p>
          <span>点击右上角加号开始记录</span>
        </div>
      </aside>

      <div
        id="resizer"
        class="resizer"
        role="separator"
        aria-label="调整笔记列表宽度"
        aria-orientation="vertical"
        tabindex="0"
        data-testid="resizer"
      ></div>

      <main class="editor-pane">
        <div id="editorEmpty" class="editor-empty" data-testid="editor-empty">
          <svg class="icon xlarge" aria-hidden="true"><use href="#icon-note"></use></svg>
          <h2>选择一条笔记开始编辑</h2>
          <p>你的内容会自动保存在本机浏览器中</p>
        </div>

        <section id="editorContent" class="editor-content" data-testid="editor" hidden>
          <header class="editor-header">
            <input
              id="titleInput"
              class="title-input"
              type="text"
              placeholder="无标题笔记"
              autocomplete="off"
              aria-label="笔记标题"
              data-testid="title-input"
            >
            <div class="editor-actions">
              <div class="view-toggle" role="group" aria-label="编辑视图">
                <button
                  id="editModeButton"
                  class="view-button is-active"
                  type="button"
                  aria-pressed="true"
                  data-testid="edit-mode"
                >编辑</button>
                <button
                  id="previewModeButton"
                  class="view-button"
                  type="button"
                  aria-pressed="false"
                  data-testid="preview-mode"
                >预览</button>
              </div>
              <span id="saveStatus" class="save-status" data-testid="save-status">已保存</span>
              <button
                id="saveButton"
                class="icon-button labeled-button"
                type="button"
                title="保存笔记"
                aria-label="保存笔记"
                data-testid="save-button"
              >
                <svg class="icon" aria-hidden="true"><use href="#icon-save"></use></svg>
                <span>保存</span>
              </button>
              <button
                id="pinButton"
                class="icon-button labeled-button"
                type="button"
                title="置顶笔记"
                aria-label="置顶笔记"
                data-testid="pin-button"
              >
                <svg class="icon icon-pin" aria-hidden="true"><use href="#icon-pin"></use></svg>
                <span id="pinButtonLabel">置顶</span>
              </button>
              <button
                id="deleteButton"
                class="icon-button danger"
                type="button"
                title="删除笔记"
                aria-label="删除笔记"
                data-testid="delete-button"
              >
                <svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
              </button>
            </div>
          </header>

          <textarea
            id="contentInput"
            class="content-input"
            placeholder="开始写下你的想法..."
            aria-label="笔记内容"
            data-testid="content-input"
          ></textarea>

          <article
            id="markdownPreview"
            class="markdown-preview"
            aria-label="Markdown 预览"
            data-testid="markdown-preview"
            hidden
          ></article>

          <footer class="editor-footer">
            <span id="wordCount" class="meta" data-testid="word-count">0 字</span>
            <span id="updatedAt" class="meta" data-testid="updated-at"></span>
          </footer>
        </section>
      </main>
    </div>

    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"></path>
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.2-3.2"></path>
      </symbol>
      <symbol id="icon-note" viewBox="0 0 24 24">
        <path d="M6 3.5h9.5L20 8v12.5H6z"></path>
        <path d="M15 3.5V8h5M9 12h6M9 16h6"></path>
      </symbol>
      <symbol id="icon-pin" viewBox="0 0 24 24">
        <path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"></path>
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"></path>
      </symbol>
      <symbol id="icon-save" viewBox="0 0 24 24">
        <path d="M5 3h11l3 3v15H5z"></path>
        <path d="M8 3v6h8V3M8 21v-7h8v7"></path>
      </symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
      </symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24">
        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
      </symbol>
    </svg>

    <script src="app.js"></script>
    <script>
      if (new URLSearchParams(window.location.search).has('ui-test')) {
        var testScript = document.createElement('script');
        testScript.src = 'tests/ui-harness.js';
        document.body.appendChild(testScript);
      }
    </script>
  </body>
</html>
