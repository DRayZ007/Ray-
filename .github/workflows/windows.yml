name: Windows desktop checks
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preview:html
      - run: npm run verify
      - run: npm run dist
      - name: Test packaged executable
        shell: pwsh
        run: |
          $env:MARK_NOTES_EXECUTABLE = Join-Path $pwd 'release/win-unpacked/马克笔记.exe'
          npx playwright test tests/desktop/smoke.spec.ts tests/desktop/export.spec.ts tests/desktop/note-drag.spec.ts
      - name: Install and uninstall smoke
        shell: pwsh
        run: ./scripts/installer-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-results
          path: |
            test-results/
            playwright-report/
            release/*Setup.exe
            build/icon-preview.png
